<section class="page dashboard-page">
    <div class="welcome-panel">
        <div>
            <span class="eyebrow light">HỌC NHẸ NHÀNG · NHỚ BỀN LÂU</span>
            <h2>你好！Hôm nay mình<br>học một chút nhé?</h2>
            <p>Ôn lại từ cũ hoặc thử sức với trò chơi nối từ HSK1.</p>
            <div class="hero-actions">
                <button class="button button-light" id="dashboard-flashcard" type="button">Bắt đầu Flashcard <span>→</span></button>
                <button class="button button-ghost-light" id="dashboard-matching" type="button">Chơi nối từ</button>
                <button class="button button-ghost-light" id="dashboard-sentences" type="button">Luyện đặt câu</button>
            </div>
        </div>
        <div class="hero-character" aria-hidden="true">
            <span>学</span>
            <small>xué · học</small>
        </div>
    </div>

    <div id="dashboard-state" class="content-state">
        <div class="page-loading compact"><span class="spinner"></span><p>Đang tải thống kê...</p></div>
    </div>
    <div id="dashboard-content" hidden>
        <div class="section-heading">
            <div><span class="eyebrow">Tiến độ hôm nay</span><h2>Bức tranh học tập</h2></div>
            <button class="text-button" id="view-progress" type="button">Xem tiến độ <span>→</span></button>
        </div>
        <div class="stats-grid dashboard-stats" id="dashboard-stats"></div>

        <div class="dashboard-columns">
            <section class="surface-panel">
                <div class="panel-heading">
                    <div><span class="eyebrow">Gần đây</span><h3>Từ vừa học</h3></div>
                    <button class="text-button" id="view-vocabulary" type="button">Tất cả</button>
                </div>
                <div id="recent-vocabulary" class="recent-list"></div>
            </section>
            <section class="surface-panel matching-summary">
                <div class="panel-heading"><div><span class="eyebrow">Nối từ</span><h3>Kết quả luyện tập</h3></div></div>
                <div id="matching-overview"></div>
            </section>
            <section class="surface-panel sentence-summary">
                <div class="panel-heading"><div><span class="eyebrow">Luyện câu</span><h3>Ghép câu Hán ngữ</h3></div><button class="text-button" id="view-sentences" type="button">Luyện ngay</button></div>
                <div id="sentence-overview"></div>
            </section>
        </div>
    </div>
</section>
