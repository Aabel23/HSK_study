<section class="page vocabulary-page">
    <div class="page-intro">
        <div><span class="eyebrow">Kho từ vựng</span><h2>150 từ nền tảng HSK1</h2><p>Tìm kiếm, xem ví dụ và đánh dấu trạng thái học của từng từ.</p></div>
        <div class="intro-seal" aria-hidden="true">词</div>
    </div>

    <form class="filter-panel" id="vocabulary-filters">
        <label class="search-field">
            <span aria-hidden="true">⌕</span>
            <input id="vocabulary-search" type="search" placeholder="Tìm chữ Hán, pinyin hoặc nghĩa..." autocomplete="off">
        </label>
        <label><span class="sr-only">Chủ đề</span><select id="topic-filter"><option value="">Tất cả chủ đề</option></select></label>
        <label><span class="sr-only">Trạng thái</span><select id="status-filter">
            <option value="">Tất cả trạng thái</option>
            <option value="new">Chưa học</option><option value="learning">Đang học</option>
            <option value="review">Cần ôn</option><option value="mastered">Đã thuộc</option>
        </select></label>
        <button class="button button-secondary" id="clear-filters" type="button">Xóa bộ lọc</button>
    </form>

    <div class="list-meta"><p id="vocabulary-count">Đang tải...</p><div class="status-legend"><span class="dot new"></span> Chưa học <span class="dot learning"></span> Đang học <span class="dot review"></span> Cần ôn <span class="dot mastered"></span> Đã thuộc</div></div>
    <div id="vocabulary-state" class="content-state"><div class="page-loading"><span class="spinner"></span><p>Đang tải từ vựng...</p></div></div>
    <div id="vocabulary-content" hidden>
        <div class="vocabulary-table-wrap">
            <table class="vocabulary-table">
                <thead><tr><th>Từ vựng</th><th>Nghĩa tiếng Việt</th><th>Chủ đề</th><th>Trạng thái</th><th><span class="sr-only">Thao tác</span></th></tr></thead>
                <tbody id="vocabulary-list"></tbody>
            </table>
        </div>
        <div class="pagination" id="vocabulary-pagination"></div>
    </div>

    <dialog class="word-dialog" id="word-dialog">
        <button class="dialog-close" type="button" id="dialog-close" aria-label="Đóng">×</button>
        <div id="word-detail"></div>
    </dialog>
</section>
