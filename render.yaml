services:
  - type: web
    name: hsk-study
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    envVars:
      - key: CHINESE_STUDY_ENV
        value: production
      - key: CHINESE_STUDY_SEED
        value: "true"
      - key: CHINESE_STUDY_DOCS
        value: "false"
      # Chấm điểm phần nói của bài thi thử HSK. `sync: false` = Render hỏi giá
      # trị trong dashboard và KHÔNG lưu vào repo — khoá không bao giờ nằm ở đây.
      # Bỏ trống thì bài thi tự chuyển sang chế độ tự chấm, app vẫn chạy.
      - key: GEMINI_API_KEY
        sync: false
      # Alias, không ghim số phiên bản: Google đã gỡ gemini-2.0-flash và mọi lần
      # chấm trả 404. Alias tự trỏ sang bản flash mới nhất còn phục vụ.
      - key: GEMINI_MODEL
        value: gemini-flash-latest
